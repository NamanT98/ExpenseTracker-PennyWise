<h2 mat-dialog-title>{{ isEditMode ? 'Edit' : 'Add' }} Transaction</h2>
<mat-dialog-content>
  <form [formGroup]="transactionForm" class="transaction-form">

    <mat-button-toggle-group formControlName="type" class="type-toggle-group" aria-label="Transaction Type">
      <mat-button-toggle value="SENT" class="toggle-sent">
        <mat-icon>arrow_upward</mat-icon>
        Expense
      </mat-button-toggle>
      <mat-button-toggle value="RECEIVED" class="toggle-received">
        <mat-icon>arrow_downward</mat-icon>
        Income
      </mat-button-toggle>
    </mat-button-toggle-group>

    <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
      <mat-label>Title</mat-label>
      <input matInput formControlName="title" placeholder="e.g. Lunch at Cafe">
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
      <mat-label>Amount</mat-label>
      <input matInput type="number" formControlName="amount" placeholder="0.00">
      <span matTextPrefix>$&nbsp;</span>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
      <mat-label>Category</mat-label>
      <mat-select formControlName="category">
        <mat-option *ngFor="let cat of categories" [value]="cat">
          {{ cat | titlecase }}
        </mat-option>
      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width" subscriptSizing="dynamic">
      <mat-label>Summary (Optional)</mat-label>
      <textarea matInput formControlName="summary" rows="3" placeholder="Additional details..."></textarea>
    </mat-form-field>

  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button (click)="onCancel()">Cancel</button>
  <button mat-raised-button color="primary" [disabled]="!transactionForm.valid" (click)="onSave()">{{ isEditMode ? 'Save' : 'Add' }}</button>
</mat-dialog-actions>
